<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — PulseCoach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<section class="screen auth-screen">
  <div class="auth-card">
    <div class="brand">
      <span class="brand-dot" aria-hidden="true"></span>
      <span class="brand-word">PulseCoach</span>
    </div>
    <p class="auth-tagline">Set a new password.</p>

    <form id="resetForm" class="auth-form">
      <label>New password
        <input type="password" name="password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters">
      </label>
      <button type="submit" class="btn btn-primary">Update password</button>
      <p class="form-error" id="resetError"></p>
      <p class="form-status" id="resetStatus"></p>
    </form>

    <p class="auth-tagline auth-tagline--spaced">
      <a id="backToLogin" href="index.html" class="link-back">← Back to log in</a>
    </p>
  </div>
</section>

<script>
  const params = new URLSearchParams(window.location.search);
  const token = params.get("token");

  const form = document.getElementById("resetForm");
  const errorEl = document.getElementById("resetError");
  const statusEl = document.getElementById("resetStatus");

  if (!token) {
    errorEl.textContent = "This reset link is missing its token — please request a new one.";
    form.querySelector("button").disabled = true;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.textContent = "";
    statusEl.textContent = "";

    const password = new FormData(form).get("password");

    try {
      const res = await fetch("/api/auth/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, password }),
      });
      const data = await res.json();

      if (!res.ok) throw new Error(data.message || "Something went wrong");

      statusEl.textContent = "Password updated — redirecting to log in…";
      setTimeout(() => (window.location.href = "index.html"), 1500);
    } catch (err) {
      errorEl.textContent = err.message;
    }
  });
</script>
</body>
</html>
